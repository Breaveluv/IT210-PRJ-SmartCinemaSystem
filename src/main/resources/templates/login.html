<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(pageTitle='Đăng nhập')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="glass-card p-5">
                <h3 class="fw-bold text-center mb-4">ĐĂNG NHẬP</h3>
                <form th:action="@{/login}" method="post">
                    <!-- Hiển thị lỗi từ Server -->
                    <div th:if="${param.error}" class="alert alert-danger small border-0 bg-danger bg-opacity-10 py-2">
                        Tài khoản hoặc mật khẩu không đúng.
                    </div>

                    <div class="mb-4">
                        <label class="small text-secondary mb-2">Tên đăng nhập</label>
                        <input type="text" name="username" class="form-control bg-dark border-secondary text-white py-2 shadow-none">
                    </div>
                    <div class="mb-4">
                        <label class="small text-secondary mb-2">Mật khẩu</label>
                        <input type="password" name="password" class="form-control bg-dark border-secondary text-white py-2 shadow-none">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-3">TIẾP TỤC</button>
                </form>
                <div class="text-center mt-4">
                    <a th:href="@{/register}" class="text-secondary small text-decoration-none">Chưa có tài khoản? <span class="text-primary fw-bold">Đăng ký</span></a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
