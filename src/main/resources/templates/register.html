<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(pageTitle='Đăng ký')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="glass-card p-5">
                <h3 class="fw-bold text-center mb-5">ĐĂNG KÝ THÀNH VIÊN</h3>

                <!-- Hiển thị lỗi chung -->
                <div th:if="${error}" class="alert alert-danger small border-0 bg-danger bg-opacity-10 py-2 mb-4">
                    <span th:text="${error}"></span>
                </div>

                <!-- Hiển thị thông báo success -->
                <div th:if="${param.success}" class="alert alert-success small border-0 bg-success bg-opacity-10 py-2 mb-4">
                    Đăng ký thành công! Vui lòng đăng nhập.
                </div>

                <form th:action="@{/register}" method="post" th:object="${user}">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="small text-secondary mb-1">Tên đăng nhập <span class="text-danger">*</span></label>
                            <input type="text" name="username" th:value="${user.username}" class="form-control bg-dark border-secondary text-white shadow-none" th:classappend="${#fields.hasErrors('username') ? 'border-danger' : ''}">
                            <small th:if="${#fields.hasErrors('username')}" class="text-danger d-block mt-1" th:errors="*{username}"></small>
                        </div>
                        <div class="col-md-6">
                            <label class="small text-secondary mb-1">Email <span class="text-danger">*</span></label>
                            <input type="email" name="email" th:value="${user.email}" class="form-control bg-dark border-secondary text-white shadow-none" th:classappend="${#fields.hasErrors('email') ? 'border-danger' : ''}">
                            <small th:if="${#fields.hasErrors('email')}" class="text-danger d-block mt-1" th:errors="*{email}"></small>
                        </div>
                        <div class="col-md-6">
                            <label class="small text-secondary mb-1">Mật khẩu <span class="text-danger">*</span></label>
                            <input type="password" name="password" class="form-control bg-dark border-secondary text-white shadow-none" th:classappend="${#fields.hasErrors('password') ? 'border-danger' : ''}">
                            <small th:if="${#fields.hasErrors('password')}" class="text-danger d-block mt-1" th:errors="*{password}"></small>
                        </div>
                        <div class="col-md-6">
                            <label class="small text-secondary mb-1">Họ tên <span class="text-danger">*</span></label>
                            <input type="text" name="fullName" th:value="${user.fullName}" class="form-control bg-dark border-secondary text-white shadow-none" th:classappend="${#fields.hasErrors('fullName') ? 'border-danger' : ''}">
                            <small th:if="${#fields.hasErrors('fullName')}" class="text-danger d-block mt-1" th:errors="*{fullName}"></small>
                        </div>
                        <div class="col-12">
                            <label class="small text-secondary mb-1">Số điện thoại <span class="text-danger">*</span></label>
                            <input type="text" name="phone" th:value="${user.phone}" class="form-control bg-dark border-secondary text-white shadow-none" th:classappend="${#fields.hasErrors('phone') ? 'border-danger' : ''}">
                            <small th:if="${#fields.hasErrors('phone')}" class="text-danger d-block mt-1" th:errors="*{phone}"></small>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-3 mt-5">HOÀN TẤT ĐĂNG KÝ</button>
                </form>

                <div class="text-center mt-4">
                    <a th:href="@{/login}" class="text-secondary small text-decoration-none">Đã có tài khoản? <span class="text-primary fw-bold">Đăng nhập</span></a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
