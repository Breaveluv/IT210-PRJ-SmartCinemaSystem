<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(pageTitle='Đăng ký')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="glass-card p-5">
                <h3 class="fw-bold text-center mb-5">ĐĂNG KÝ THÀNH VIÊN</h3>
                <form th:action="@{/register}" method="post">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="small text-secondary mb-1">Tên đăng nhập</label>
                            <input type="text" name="username" class="form-control bg-dark border-secondary text-white shadow-none">
                        </div>
                        <div class="col-md-6">
                            <label class="small text-secondary mb-1">Email</label>
                            <input type="email" name="email" class="form-control bg-dark border-secondary text-white shadow-none">
                        </div>
                        <div class="col-md-6">
                            <label class="small text-secondary mb-1">Mật khẩu</label>
                            <input type="password" name="password" class="form-control bg-dark border-secondary text-white shadow-none">
                        </div>
                        <div class="col-md-6">
                            <label class="small text-secondary mb-1">Họ tên</label>
                            <input type="text" name="fullName" class="form-control bg-dark border-secondary text-white shadow-none">
                        </div>
                        <div class="col-12">
                            <label class="small text-secondary mb-1">Số điện thoại</label>
                            <input type="text" name="phone" class="form-control bg-dark border-secondary text-white shadow-none">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-3 mt-5">HOÀN TẤT ĐĂNG KÝ</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
