<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header-css">
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { margin-bottom: 20px; }
        /* Removed margin-top from footer style, it will be handled by flexbox */
        footer { padding: 20px 0; background-color: #343a40; color: white; }
        .movie-card img { height: 350px; object-fit: cover; }
        .movie-details-poster { max-height: 500px; object-fit: contain; }
        .seat-btn { font-size: 0.75rem; }
    </style>
</head>
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">SMART CINEMA</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/movies}">Phim</a></li>
                </ul>
                <ul class="navbar-nav">
                    <th:block th:if="${session.loggedInUser == null}">
                        <li class="nav-item"><a class="nav-link" th:href="@{/login}">Đăng nhập</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/register}">Đăng ký</a></li>
                    </th:block>
                    <th:block th:if="${session.loggedInUser != null}">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                                Chào, <span th:text="${session.loggedInUser.fullName}">User</span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" th:href="@{/booking/history}">Lịch sử đặt vé</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item text-danger" th:href="@{/logout}">Đăng xuất</a></li>
                            </ul>
                        </li>
                    </th:block>
                </ul>
            </div>
        </div>
    </nav>
</body>
</html>
