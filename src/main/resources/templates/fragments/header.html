<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'CinemaMax | Hệ Thống Đặt Vé'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff3d00; --bg-dark: #05070a; --glass: rgba(255,255,255,0.05); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-dark); color: #fff; }
        .navbar { background: #000; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .navbar-brand { font-weight: 800; color: var(--primary) !important; }
        .glass-card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; backdrop-filter: blur(10px); }
        .btn-primary { background: var(--primary); border: none; font-weight: 600; border-radius: 10px; padding: 12px 24px; }

        /* CSS CHO GHẾ KHÔNG DÙNG JS */
        .seat-checkbox { display: none; } /* Ẩn checkbox mặc định */
        .seat-label {
            display: inline-block;
            width: 35px; height: 35px;
            background: #2d3436;
            border-radius: 6px;
            margin: 4px;
            cursor: pointer;
            line-height: 35px;
            text-align: center;
            font-size: 10px;
            transition: 0.3s;
        }
        .seat-checkbox:checked + .seat-label {
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
        }
        .seat-checkbox:disabled + .seat-label {
            background: rgba(255,255,255,0.1);
            cursor: not-allowed;
            color: transparent;
        }
        .screen { width: 100%; height: 5px; background: var(--primary); box-shadow: 0 5px 15px var(--primary); border-radius: 50%; margin-bottom: 50px; }
    </style>
</head>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fs-3" href="/">CINEMAMAX</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link px-3" href="/">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link px-3" href="/movie">Phim</a></li>
                <li th:if="${session.loggedInUser == null}" class="nav-item"><a class="nav-link px-3" href="/login">Đăng nhập</a></li>
                <li th:if="${session.loggedInUser == null}" class="nav-item"><a class="btn btn-primary btn-sm ms-lg-3" href="/register">Đăng ký</a></li>
                <li th:if="${session.loggedInUser != null}" class="nav-item dropdown ms-lg-3">
                    <a class="nav-link dropdown-toggle glass-card px-3 py-1 rounded-pill" href="#" data-bs-toggle="dropdown">
                        <i class="fa-regular fa-user me-2"></i><span th:text="${session.loggedInUser.username}"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end glass-card border-0 shadow-lg">
                        <li><a class="dropdown-item text-white" href="/profile">Hồ sơ</a></li>
                        <li><a class="dropdown-item text-white" href="/booking/history">Lịch sử vé</a></li>
                        <li th:if="${session.loggedInUser.role.name() == 'ADMIN'}"><a class="dropdown-item text-info" href="/admin/dashboard">Admin</a></li>
                        <li><hr class="dropdown-divider bg-secondary"></li>
                        <li><a class="dropdown-item text-danger" href="/logout">Đăng xuất</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
</html>
