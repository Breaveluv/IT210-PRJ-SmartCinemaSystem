<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${pageTitle} ?: 'Smart Cinema Booking System'"></title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            margin-bottom: 20px;
        }
    </style>
    <!-- Placeholder for page-specific head content (e.g., custom styles) -->
    <th:block th:replace="${headExtra} ?: ~{}"></th:block>
</head>
<body>
    <!-- Common Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/">Smart Cinema</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Trang Chủ</a>
                </li>
                <li class="nav-item" th:if="${session.loggedInUser == null}">
                    <a class="nav-link" href="/login">Đăng Nhập</a>
                </li>
                <li class="nav-item" th:if="${session.loggedInUser == null}">
                    <a class="nav-link" href="/register">Đăng Ký</a>
                </li>
                <li class="nav-item dropdown" th:if="${session.loggedInUser != null}">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        Xin chào, <span th:text="${session.loggedInUser.username}"></span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-right" aria-labelledby="navbarDropdown">
                        <a class="dropdown-item" href="/profile">Hồ sơ</a>
                        <a class="dropdown-item" href="/booking/history">Lịch sử đặt vé</a>
                        <a class="dropdown-item" th:if="${session.loggedInUser != null and session.loggedInUser.role == T(com.example.smartcinemabookingsystem.model.User$Role).ADMIN}" href="/admin/dashboard">Admin Dashboard</a>
                        <a class="dropdown-item" href="/logout">Đăng xuất</a>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Placeholder for page-specific content -->
    <th:block th:replace="${content}"></th:block>

    <!-- Common scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- Placeholder for page-specific scripts -->
    <th:block th:replace="${scriptExtra} ?: ~{}"></th:block>
</body>
</html>
