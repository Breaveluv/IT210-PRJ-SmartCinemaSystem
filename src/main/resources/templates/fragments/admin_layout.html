<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="adminHead(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0d1626;
            color: #eaf1ff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .sidebar {
            position: fixed;
            inset: 0 auto 0 0;
            width: 336px;
            background: #101928;
            padding: 36px 22px;
        }

        .sidebar .logo {
            color: #fff;
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 54px;
            letter-spacing: -1px;
        }

        .sidebar .logo span {
            color: #ff4d6d;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 280px;
            min-height: 60px;
            padding: 16px 16px;
            margin-bottom: 10px;
            border-radius: 11px;
            color: #eaf1ff;
            text-decoration: none;
            font-size: 20px;
            line-height: 1;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #ff4773;
            color: #fff;
        }

        .sidebar i {
            width: 24px;
            color: inherit;
            text-align: center;
        }

        .main-content {
            margin-left: 336px;
            min-height: 100vh;
            padding: 38px 20px 38px 24px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 30px;
        }

        .topbar h2 {
            margin: 0;
            color: #fff;
            font-weight: 700;
            font-size: 40px;
            letter-spacing: 0;
        }

        .table-wrap,
        .form-card {
            background: #fff;
            color: #000;
            border-radius: 8px;
            padding: 22px;
            overflow-x: auto;
        }

        .table {
            color: #000;
            font-size: 20px;
        }

        .table > :not(caption) > * > * {
            padding: 12px 10px;
            vertical-align: middle;
        }

        .table thead th {
            border-bottom: 1px solid #d7dce3;
            font-weight: 700;
            white-space: nowrap;
        }

        .table tbody td {
            border-bottom: 1px solid #d7dce3;
        }

        .table .text-muted,
        .muted-value {
            color: #4b5563 !important;
            font-size: 14px;
        }

        .btn-accent {
            background: #ff4773;
            border-color: #ff4773;
            color: #fff;
            border-radius: 8px;
            font-size: 20px;
            font-weight: 700;
            padding: 12px 18px;
        }

        .btn-accent:hover {
            background: #ef3d67;
            border-color: #ef3d67;
            color: #fff;
        }

        .btn-sm {
            font-size: 16px;
            padding: 7px 10px;
            border-radius: 5px;
        }

        .badge {
            border-radius: 7px;
            font-size: 14px;
            padding: 6px 10px;
        }

        .form-label {
            font-weight: 700;
        }

        @media (max-width: 900px) {
            .sidebar {
                position: static;
                width: 100%;
                height: auto;
                padding: 20px;
            }

            .sidebar a {
                width: 100%;
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .topbar h2 {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>
<div th:fragment="sidebar(active)" class="sidebar">
    <div class="logo">Cine<span>Max</span></div>

    <a th:href="@{/admin/dashboard}" th:classappend="${active == 'dashboard' ? 'active' : ''}">
        <i class="fa-solid fa-chart-line"></i>
        Dashboard
    </a>
    <a th:href="@{/admin/movies}" th:classappend="${active == 'movies' ? 'active' : ''}">
        <i class="fa-solid fa-film"></i>
        Movies
    </a>
    <a th:href="@{/admin/showtimes}" th:classappend="${active == 'showtimes' ? 'active' : ''}">
        <i class="fa-solid fa-calendar-days"></i>
        Showtimes
    </a>
    <a th:href="@{/admin/rooms}" th:classappend="${active == 'rooms' ? 'active' : ''}">
        <i class="fa-solid fa-door-open"></i>
        Rooms
    </a>
    <a th:href="@{/admin/genres}" th:classappend="${active == 'genres' ? 'active' : ''}">
        <i class="fa-solid fa-tags"></i>
        Genres
    </a>
    <a th:href="@{/admin/bookings}" th:classappend="${active == 'bookings' ? 'active' : ''}">
        <i class="fa-solid fa-ticket"></i>
        Bookings
    </a>
    <a th:href="@{/admin/users}" th:classappend="${active == 'users' ? 'active' : ''}">
        <i class="fa-solid fa-users"></i>
        Users
    </a>
    <a th:href="@{/logout}">
        <i class="fa-solid fa-right-from-bracket"></i>
        Logout
    </a>
</div>
</body>
</html>
