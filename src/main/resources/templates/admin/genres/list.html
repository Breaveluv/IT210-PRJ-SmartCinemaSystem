<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin_layout :: adminHead(pageTitle='Quản lý thể loại')}"></head>
<body>
    <div th:replace="~{fragments/admin_layout :: sidebar(active='genres')}"></div>

    <div class="main-content">
        <div class="topbar">
            <h2>Quản lý thể loại</h2>
            <a th:href="@{/admin/genres/new}" class="btn btn-accent">
                <i class="fa-solid fa-plus me-2"></i> Thêm thể loại
            </a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="table-wrap">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th style="width: 90px;">ID</th>
                        <th>Tên thể loại</th>
                        <th style="width: 220px;">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="genre : ${genres}">
                        <td th:text="${genre.id}"></td>
                        <td th:text="${genre.name}"></td>
                        <td>
                            <a th:href="@{/admin/genres/edit/{id}(id=${genre.id})}" class="btn btn-sm btn-outline-warning">
                                <i class="fa-solid fa-edit"></i> Sửa
                            </a>
                            <a th:href="@{/admin/genres/delete/{id}(id=${genre.id})}" class="btn btn-sm btn-outline-danger">
                                <i class="fa-solid fa-trash"></i> Xóa
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(genres)}">
                        <td colspan="3" class="text-center text-muted">Chưa có thể loại nào.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
