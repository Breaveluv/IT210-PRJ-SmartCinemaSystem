<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin_layout :: adminHead(pageTitle=${genre.id == null ? 'Thêm thể loại' : 'Sửa thể loại'})}"></head>
<body>
    <div th:replace="~{fragments/admin_layout :: sidebar(active='genres')}"></div>

    <div class="main-content">
        <div class="topbar">
            <h2 th:text="${genre.id == null ? 'Thêm thể loại' : 'Sửa thể loại'}"></h2>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <div class="row">
            <div class="col-md-6">
                <div class="form-card">
                    <form th:action="@{/admin/genres/save}" th:object="${genre}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">Tên thể loại</label>
                            <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-accent">
                                <i class="fa-solid fa-save me-2"></i> Lưu
                            </button>
                            <a th:href="@{/admin/genres}" class="btn btn-secondary">
                                <i class="fa-solid fa-times me-2"></i> Hủy
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
