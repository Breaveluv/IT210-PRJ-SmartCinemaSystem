<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin_layout :: adminHead(pageTitle='Quản lý phòng chiếu')}"></head>
<body>
    <div th:replace="~{fragments/admin_layout :: sidebar(active='rooms')}"></div>

    <div class="main-content">
        <div class="topbar">
            <h2>Quản lý phòng chiếu</h2>
            <a th:href="@{/admin/rooms/new}" class="btn btn-accent">
                <i class="fa-solid fa-plus me-2"></i> Thêm phòng
            </a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="table-wrap">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th style="width: 90px;">ID</th>
                        <th>Tên phòng</th>
                        <th>Tổng số ghế</th>
                        <th style="width: 220px;">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="room : ${rooms}">
                        <td th:text="${room.id}"></td>
                        <td th:text="${room.name}"></td>
                        <td th:text="${room.totalSeats}"></td>
                        <td>
                            <a th:href="@{/admin/rooms/edit/{id}(id=${room.id})}" class="btn btn-sm btn-outline-warning">
                                <i class="fa-solid fa-edit"></i> Sửa
                            </a>
                            <form th:action="@{/admin/rooms/delete/{id}(id=${room.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Bạn có chắc muốn xóa phòng chiếu này không?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="fa-solid fa-trash"></i> Xóa
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(rooms)}">
                        <td colspan="4" class="text-center text-muted">Chưa có phòng chiếu nào.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
