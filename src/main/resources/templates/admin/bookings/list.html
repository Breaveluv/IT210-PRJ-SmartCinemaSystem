<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin_layout :: adminHead(pageTitle='Quản lý đặt vé')}"></head>
<body>
    <div th:replace="~{fragments/admin_layout :: sidebar(active='bookings')}"></div>

    <div class="main-content">
        <div class="topbar">
            <h2>Quản lý đặt vé</h2>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="table-wrap">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Khách hàng</th>
                        <th>Ngày đặt</th>
                        <th>Số vé</th>
                        <th>Tổng tiền</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="booking : ${bookings}">
                        <td th:text="${booking.id}"></td>
                        <td>
                            <div th:text="${booking.user.fullName != null and !booking.user.fullName.isBlank() ? booking.user.fullName : booking.user.username}"></div>
                            <div class="muted-value" th:text="${booking.user.email}"></div>
                        </td>
                        <td th:text="${#temporals.format(booking.bookingTime, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${booking.tickets.size()} + ' vé'"></td>
                        <td>
                            <span class="badge bg-success"
                                  th:text="${#numbers.formatDecimal(booking.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'"></span>
                        </td>
                        <td>
                            <span th:switch="${booking.status.name()}">
                                <span th:case="'PENDING'" class="badge bg-primary">Đang chờ</span>
                                <span th:case="'CONFIRMED'" class="badge bg-success">Đã xác nhận</span>
                                <span th:case="'CANCELLED'" class="badge bg-danger">Đã hủy</span>
                            </span>
                        </td>
                        <td>
                            <a th:href="@{|/admin/bookings/${booking.id}|}" class="btn btn-sm btn-outline-primary">
                                <i class="fa-solid fa-eye"></i> Xem
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(bookings)}">
                        <td colspan="7" class="text-center text-muted">Chưa có đơn đặt vé nào</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
