<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin_layout :: adminHead(pageTitle=${movie.id == null ? 'Thêm phim' : 'Sửa phim'})}"></head>
<body>
    <div th:replace="~{fragments/admin_layout :: sidebar(active='movies')}"></div>

    <div class="main-content">
        <div class="topbar">
            <h2 th:text="${movie.id == null ? 'Thêm phim mới' : 'Sửa thông tin phim'}"></h2>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <div class="row">
            <div class="col-md-8">
                <div class="form-card">
                    <form th:action="@{/admin/movies/save}" th:object="${movie}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">Tên phim</label>
                            <input type="text" th:field="*{title}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Thời lượng (phút)</label>
                            <input type="number" th:field="*{duration}" class="form-control" min="1" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">URL Poster</label>
                            <input type="text" th:field="*{posterUrl}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('posterUrl')}" th:errors="*{posterUrl}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mô tả</label>
                            <textarea th:field="*{description}" class="form-control" rows="5" th:errorclass="is-invalid"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Thể loại</label>
                            <div class="row" th:classappend="${#fields.hasErrors('genres')} ? 'is-invalid' : ''">
                                <div class="col-md-6" th:each="genre : ${allGenres}">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="genreIds"
                                               th:id="${'genre-' + genre.id}"
                                               th:value="${genre.id}"
                                               th:checked="${movie.genres != null and movie.genres.contains(genre)}">
                                        <label class="form-check-label" th:for="${'genre-' + genre.id}" th:text="${genre.name}"></label>
                                    </div>
                                </div>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('genres')}" th:errors="*{genres}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-accent">
                                <i class="fa-solid fa-save me-2"></i> Lưu
                            </button>
                            <a th:href="@{/admin/movies}" class="btn btn-secondary">
                                <i class="fa-solid fa-times me-2"></i> Hủy
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
