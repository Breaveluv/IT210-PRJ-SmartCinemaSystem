<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin_layout :: adminHead(pageTitle='Quản lý phim')}"></head>
<body>
    <div th:replace="~{fragments/admin_layout :: sidebar(active='movies')}"></div>

    <div class="main-content">
        <div class="topbar">
            <div class="topbar-left">
                <h2>Quản lý phim</h2>
            </div>
            <a th:href="@{/admin/movies/new}" class="btn btn-accent">
                <i class="fa-solid fa-plus me-2"></i> Thêm phim
            </a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="table-wrap">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Poster</th>
                        <th>Tên phim</th>
                        <th>Thời lượng</th>
                        <th>Thể loại</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="movie : ${movies}">
                        <td th:text="${movie.id}"></td>
                        <td>
                            <img th:src="${movie.posterUrl != null and !movie.posterUrl.isBlank() ? movie.posterUrl : 'https://via.placeholder.com/64x90?text=No+Image'}"
                                 style="width: 50px; height: 70px; object-fit: cover; border-radius: 4px;" alt="Poster">
                        </td>
                        <td th:text="${movie.title}"></td>
                        <td th:text="${movie.duration + ' phút'}"></td>
                        <td>
                            <span th:each="genre, iterStat : ${movie.genres}"
                                  th:text="${genre.name + (!iterStat.last ? ', ' : '')}"></span>
                        </td>
                        <td>
                            <a th:href="@{|/admin/movies/edit/${movie.id}|}" class="btn btn-sm btn-outline-primary">
                                <i class="fa-solid fa-edit"></i> Sửa
                            </a>
                            <a th:href="@{|/admin/movies/delete/${movie.id}|}" class="btn btn-sm btn-outline-danger">
                                <i class="fa-solid fa-trash"></i> Xóa
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(movies)}">
                        <td colspan="6" class="text-center text-muted">Chưa có phim nào</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
