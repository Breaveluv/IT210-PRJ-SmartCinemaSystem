<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Suất chiếu</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 20px;
        }
        .table th, .table td {
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="my-4 text-center">Quản lý Suất chiếu</h1>

        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <span th:text="${errorMessage}"></span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success" role="alert">
            <span th:text="${successMessage}"></span>
        </div>

        <div class="mb-3">
            <a th:href="@{/admin/showtimes/new}" class="btn btn-primary">Thêm Suất chiếu mới</a>
        </div>

        <table class="table table-striped table-bordered">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Phim</th>
                    <th>Phòng</th>
                    <th>Thời gian bắt đầu</th>
                    <th>Thời gian kết thúc</th>
                    <th>Giá vé</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="showtime : ${showtimes}">
                    <td th:text="${showtime.id}"></td>
                    <td th:text="${showtime.movie.title}"></td>
                    <td th:text="${showtime.room.name}"></td>
                    <td th:text="${#temporals.format(showtime.startTime, 'dd-MM-yyyy HH:mm')}"></td>
                    <td th:text="${#temporals.format(showtime.endTime, 'dd-MM-yyyy HH:mm')}"></td>
                    <td th:text="${#numbers.formatDecimal(showtime.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
                    <td>
                        <a th:href="@{/admin/showtimes/edit/{id}(id=${showtime.id})}" class="btn btn-info btn-sm">Sửa</a>
                        <a th:href="@{/admin/showtimes/delete/{id}(id=${showtime.id})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('Bạn có chắc chắn muốn xóa suất chiếu này không?');">Xóa</a>
                    </td>
                </tr>
                <tr th:if="${showtimes.isEmpty()}">
                    <td colspan="7" class="text-center">Không có suất chiếu nào.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
