<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin_layout :: adminHead(pageTitle='Quản lý suất chiếu')}"></head>
<body>
    <div th:replace="~{fragments/admin_layout :: sidebar(active='showtimes')}"></div>

    <div class="main-content">
        <div class="topbar">
            <div class="topbar-left">
                <h2>Quản lý suất chiếu</h2>
            </div>
            <a th:href="@{/admin/showtimes/new}" class="btn btn-accent">
                <i class="fa-solid fa-plus me-2"></i> Thêm suất chiếu
            </a>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <div class="table-wrap">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Phim</th>
                        <th>Phòng</th>
                        <th>Bắt đầu</th>
                        <th>Kết thúc</th>
                        <th>Giá vé</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="showtime : ${showtimes}">
                        <td th:text="${showtime.id}"></td>
                        <td>
                            <div th:text="${showtime.movie.title}"></div>
                            <div class="text-muted" style="font-size: 12px;" th:text="${showtime.movie.duration + ' phút'}"></div>
                        </td>
                        <td th:text="${showtime.room.name}"></td>
                        <td th:text="${#temporals.format(showtime.startTime, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${#temporals.format(showtime.endTime, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <span class="badge bg-success" th:text="${#numbers.formatDecimal(showtime.price, 0, 'COMMA', 0, 'POINT')} + ' VND'"></span>
                        </td>
                        <td>

                            <a th:href="@{|/admin/showtimes/edit/${showtime.id}|}" class="btn btn-sm btn-outline-warning">
                                <i class="fa-solid fa-edit"></i> Sửa
                            </a>
                            <a th:href="@{|/admin/showtimes/delete/${showtime.id}|}" class="btn btn-sm btn-outline-danger">
                                <i class="fa-solid fa-trash"></i> Xóa
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(showtimes)}">
                        <td colspan="7" class="text-center text-muted">Chưa có suất chiếu nào</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
