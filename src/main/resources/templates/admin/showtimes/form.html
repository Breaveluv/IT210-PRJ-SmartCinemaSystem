<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin_layout :: adminHead(pageTitle=${showtime.id == null ? 'Thêm suất chiếu' : 'Sửa suất chiếu'})}"></head>
<body>
    <div th:replace="~{fragments/admin_layout :: sidebar(active='showtimes')}"></div>

    <div class="main-content">
        <div class="topbar">
            <h2 th:text="${showtime.id == null ? 'Thêm suất chiếu' : 'Sửa suất chiếu'}"></h2>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="row">
            <div class="col-md-8">
                <div class="form-card">
                    <form th:action="@{/admin/showtimes/save}" th:object="${showtime}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">Phim</label>
                            <select th:field="*{movie.id}" class="form-control" th:classappend="${#fields.hasErrors('movie.id')} ? 'is-invalid' : ''">
                                <option value="">-- Chọn phim --</option>
                                <option th:each="m : ${movies}" th:value="${m.id}" th:text="${m.title}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('movie.id')}" th:errors="*{movie.id}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phòng chiếu</label>
                            <select th:field="*{room.id}" class="form-control" th:classappend="${#fields.hasErrors('room.id')} ? 'is-invalid' : ''">
                                <option value="">-- Chọn phòng --</option>
                                <option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.name}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('room.id')}" th:errors="*{room.id}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Thời gian bắt đầu</label>
                            <input type="datetime-local" th:field="*{startTime}" class="form-control" required th:classappend="${#fields.hasErrors('startTime')} ? 'is-invalid' : ''">
                            <small class="text-muted">Thời gian phải lớn hơn hiện tại</small>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Giá vé (VNĐ)</label>
                            <input type="number" th:field="*{price}" class="form-control" min="0" required th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-accent">
                                <i class="fa-solid fa-save me-2"></i> Lưu
                            </button>
                            <a th:href="@{/admin/showtimes}" class="btn btn-secondary">
                                <i class="fa-solid fa-times me-2"></i> Hủy
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
