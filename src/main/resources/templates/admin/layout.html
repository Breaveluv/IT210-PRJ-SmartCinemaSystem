<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Cinema</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#0f172a;
            overflow-x:hidden;
        }

        /* SIDEBAR */

        .sidebar{
            width:280px;
            height:100vh;
            position:fixed;
            top:0;
            left:0;
            background:#111827;
            padding:30px 20px;
        }

        .logo{
            color:white;
            font-size:30px;
            font-weight:700;
            margin-bottom:40px;
        }

        .logo span{
            color:#ff4d6d;
        }

        .menu-title{
            color:#64748b;
            font-size:12px;
            margin-bottom:10px;
            text-transform:uppercase;
        }

        .sidebar a{
            display:flex;
            align-items:center;
            gap:14px;
            padding:14px 18px;
            text-decoration:none;
            color:#cbd5e1;
            border-radius:16px;
            margin-bottom:12px;
            transition:0.3s;
        }

        .sidebar a:hover,
        .sidebar a.active{
            background:linear-gradient(135deg,#ff4d6d,#ff758f);
            color:white;
        }

        /* MAIN */

        .main-content{
            margin-left:280px;
            padding:30px;
        }

        /* TOPBAR */

        .topbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:35px;
        }

        .topbar h2{
            color:white;
            font-weight:700;
        }

        .topbar p{
            color:#94a3b8;
        }

        .search-box{
            width:320px;
            border:none;
            outline:none;
            background:#1e293b;
            padding:12px 18px;
            border-radius:16px;
            color:white;
        }

        .search-box::placeholder{
            color:#94a3b8;
        }

        .profile{
            display:flex;
            align-items:center;
            gap:15px;
        }

        .profile img{
            width:50px;
            height:50px;
            border-radius:50%;
            border:3px solid #ff4d6d;
        }

    </style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">
        Cine<span>Max</span>
    </div>

    <div class="menu-title">
        Main Menu
    </div>

    <a th:href="@{/admin/dashboard}" th:classappend="${param.page == 'dashboard' ? 'active' : ''}">
        <i class="fa-solid fa-chart-line"></i>
        Dashboard
    </a>

    <a th:href="@{/admin/movies}" th:classappend="${param.page == 'movies' ? 'active' : ''}">
        <i class="fa-solid fa-film"></i>
        Movies
    </a>

    <a th:href="@{/admin/showtimes}" th:classappend="${param.page == 'showtimes' ? 'active' : ''}">
        <i class="fa-solid fa-calendar-days"></i>
        Showtimes
    </a>

    <a th:href="@{/admin/bookings}" th:classappend="${param.page == 'bookings' ? 'active' : ''}">
        <i class="fa-solid fa-ticket"></i>
        Bookings
    </a>

    <a th:href="@{/admin/users}" th:classappend="${param.page == 'users' ? 'active' : ''}">
        <i class="fa-solid fa-users"></i>
        Users
    </a>

    <div class="menu-title">
        Settings
    </div>

    <a th:href="@{/admin/settings}" th:classappend="${param.page == 'settings' ? 'active' : ''}">
        <i class="fa-solid fa-gear"></i>
        Settings
    </a>

    <a th:href="@{/logout}">
        <i class="fa-solid fa-right-from-bracket"></i>
        Logout
    </a>

</div>

<!-- MAIN -->

<div class="main-content">

    <!-- TOPBAR -->

    <div class="topbar">

        <div>
            <h2>Cinema Dashboard</h2>
            <p>Manage your cinema system</p>
        </div>

        <div class="profile">

            <input type="text"
                   class="search-box"
                   placeholder="Search...">

            <img th:src="@{https://i.pravatar.cc/100}"
                 th:alt="${#authentication.name ?: 'Admin'}">

        </div>

    </div>

    <!-- CONTENT -->

    <main layout:fragment="content"></main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
