<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Cinema</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#0d1626;
            overflow-x:hidden;
        }

        /* SIDEBAR */

        .sidebar{
            width:336px;
            height:100vh;
            position:fixed;
            top:0;
            left:0;
            background:#101928;
            padding:36px 22px;
        }

        .logo{
            color:white;
            font-size:34px;
            font-weight:700;
            margin-bottom:54px;
            letter-spacing:-1px;
        }
        .logo span{
            color:#ff4d6d;
        }

        .menu-title{
            color:#64748b;
            font-size:12px;
            margin-bottom:10px;
            text-transform:uppercase;
        }

        .sidebar a{
            display:flex;
            align-items:center;
            gap:14px;
            width:280px;
            min-height:60px;
            padding:16px 16px;
            text-decoration:none;
            color:#eaf1ff;
            border-radius:11px;
            margin-bottom:10px;
            font-size:20px;
            line-height:1;
            transition:0.3s;
        }

        .sidebar a:hover,
        .sidebar a.active{
            background:#ff4773;
            color:white;
        }

        .sidebar i{
            width:24px;
            text-align:center;
        }

        /* MAIN */

        .main-content{
            margin-left:336px;
            padding:38px 20px 38px 24px;
        }

        /* TOPBAR */

        .topbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:30px;
        }
        .topbar h2{
            color:white;
            font-weight:700;
            font-size:40px;
            letter-spacing:0;
        }
        .topbar p{
            color:#94a3b8;
        }

        .search-box{
            width:320px;
            border:none;
            outline:none;
            background:#1e293b;
            padding:12px 18px;
            border-radius:16px;
            color:white;
        }

        .search-box::placeholder{
            color:#94a3b8;
        }

        @media (max-width: 900px){
            .sidebar{
                position:static;
                width:100%;
                height:auto;
                padding:20px;
            }

            .sidebar a{
                width:100%;
            }

            .main-content{
                margin-left:0;
                padding:20px;
            }

            .topbar{
                align-items:flex-start;
                flex-direction:column;
            }

            .topbar h2{
                font-size:30px;
            }
        }
    </style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">
        Cine<span>Max</span>
    </div>

    <div class="menu-title">
        Main Menu
    </div>

    <a th:href="@{/admin/dashboard}" th:classappend="${param.page == 'dashboard' ? 'active' : ''}">
        <i class="fa-solid fa-chart-line"></i>
        Dashboard
    </a>

    <a th:href="@{/admin/movies}" th:classappend="${param.page == 'movies' ? 'active' : ''}">
        <i class="fa-solid fa-film"></i>
        Movies
    </a>

    <a th:href="@{/admin/showtimes}" th:classappend="${param.page == 'showtimes' ? 'active' : ''}">
        <i class="fa-solid fa-calendar-days"></i>
        Showtimes
    </a>

    <a th:href="@{/admin/rooms}" th:classappend="${param.page == 'rooms' ? 'active' : ''}">
        <i class="fa-solid fa-door-open"></i>
        Rooms
    </a>

    <a th:href="@{/admin/genres}" th:classappend="${param.page == 'genres' ? 'active' : ''}">
        <i class="fa-solid fa-tags"></i>
        Genres
    </a>

    <a th:href="@{/admin/bookings}" th:classappend="${param.page == 'bookings' ? 'active' : ''}">
        <i class="fa-solid fa-ticket"></i>
        Bookings
    </a>
    <a th:href="@{/admin/users}" th:classappend="${param.page == 'users' ? 'active' : ''}">
        <i class="fa-solid fa-users"></i>
        Users
    </a>

    <div class="menu-title">
        Settings
    </div>

    <a th:href="@{/logout}">
        <i class="fa-solid fa-right-from-bracket"></i>
        Logout
    </a>

</div>

<!-- MAIN -->

<div class="main-content">

    <!-- TOPBAR -->

    <div class="topbar">

        <div>
            <h2>Cinema Dashboard</h2>
            <p>Manage your cinema system</p>
        </div>

    </div>

    <!-- CONTENT -->

    <main layout:fragment="content"></main>

</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
