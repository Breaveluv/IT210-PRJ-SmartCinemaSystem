<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin_layout :: adminHead(pageTitle='Dashboard')}"></head>
<body>
    <div th:replace="~{fragments/admin_layout :: sidebar(active='dashboard')}"></div>

    <div class="main-content">
        <div class="topbar">
            <h2>Dashboard</h2>
        </div>

        <div class="row mb-4">
            <div class="col-md-3">
                <div class="stat-dashboard">
                    <div class="stat-circle revenue">
                        <i class="fa-solid fa-money-bill-wave"></i>
                    </div>
                    <div class="stat-text">
                        <div class="stat-value" th:text="${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></div>
                        <div class="stat-label">Tổng Doanh Thu</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-dashboard">
                    <div class="stat-circle bookings">
                        <i class="fa-solid fa-ticket"></i>
                    </div>
                    <div class="stat-text">
                        <div class="stat-value" th:text="${totalBookings}"></div>
                        <div class="stat-label">Tổng Đặt Vé</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-dashboard">
                    <div class="stat-circle users">
                        <i class="fa-solid fa-users"></i>
                    </div>
                    <div class="stat-text">
                        <div class="stat-value" th:text="${totalUsers}"></div>
                        <div class="stat-label">Tổng Người Dùng</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-dashboard">
                    <div class="stat-circle movies">
                        <i class="fa-solid fa-film"></i>
                    </div>
                    <div class="stat-text">
                        <div class="stat-value" th:text="${totalMovies}"></div>
                        <div class="stat-label">Tổng Phim</div>
                    </div>
                </div>
            </div>
        </div>

        <h3 class="mt-4 mb-3">Đặt Vé Gần Đây</h3>
        <div class="table-wrap">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Người Dùng</th>
                        <th>Thời Gian</th>
                        <th>Tổng Tiền</th>
                        <th>Trạng Thái</th>
                        <th>Hành Động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="booking : ${recentBookings}">
                        <td th:text="${booking.id}"></td>
                        <td th:text="${booking.user.username}"></td>
                        <td th:text="${#temporals.format(booking.bookingTime, 'dd-MM-yyyy HH:mm')}"></td>
                        <td th:text="${#numbers.formatDecimal(booking.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
                        <td>
                            <span th:switch="${booking.status.name()}" th:classappend="${booking.status.name() == 'PENDING' ? 'badge bg-primary' : booking.status.name() == 'CONFIRMED' ? 'badge bg-success' : 'badge bg-danger'}">
                                <span th:case="'PENDING'">Đang chờ</span>
                                <span th:case="'CONFIRMED'">Đã xác nhận</span>
                                <span th:case="'CANCELLED'">Đã hủy</span>
                            </span>
                        </td>
                        <td>
                            <a th:href="@{|/admin/bookings/${booking.id}|}" class="btn btn-sm btn-outline-primary">Xem</a>
                        </td>
                    </tr>
                    <tr th:if="${recentBookings.isEmpty()}">
                        <td colspan="6" class="text-center text-muted">Không có đặt vé gần đây</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="mt-3 text-end">
            <a href="/admin/bookings" class="btn btn-accent">Xem Tất Cả Đặt Vé</a>
        </div>
    </div>

    <style>
        .stat-dashboard {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stat-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .stat-circle.revenue {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }

        .stat-circle.bookings {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
        }

        .stat-circle.users {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
        }

        .stat-circle.movies {
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
        }

        .stat-text {
            flex: 1;
        }

        .stat-text .stat-value {
            color: white;
            font-size: 20px;
            font-weight: 700;
        }

        .stat-text .stat-label {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 3px;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
