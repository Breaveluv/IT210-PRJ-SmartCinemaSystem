<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-css}">
    <title>Chi tiết phim - Smart Cinema</title>
</head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="container mt-4">
        <div class="row" th:if="${movie}">
            <div class="col-md-4">
                <img th:src="${movie.posterUrl != null ? movie.posterUrl : 'https://via.placeholder.com/300x450?text=No+Image'}"
                     onerror="this.onerror=null;this.src='https://via.placeholder.com/300x450?text=No+Image';"
                     class="img-fluid rounded shadow movie-details-poster" alt="Movie Poster">
            </div>
            <div class="col-md-8">
                <h1 th:text="${movie.title}">Tên phim</h1>
                <p class="text-muted">
                    <span class="badge bg-secondary me-1" th:each="genre : ${movie.genres}" th:text="${genre.name}"></span>
                    | <span th:text="${movie.duration + ' phút'}"></span>
                </p>
                <hr>
                <h5>Nội dung phim</h5>
                <p th:text="${movie.description}">Mô tả chi tiết phim...</p>

                <h5 class="mt-4">Suất chiếu hiện có</h5>
                <div class="list-group">
                    <div th:each="showtime : ${showtimes}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                        <div>
                            <strong th:text="${#temporals.format(showtime.startTime, 'HH:mm dd/MM/yyyy')}"></strong>
                            <span class="ms-3 text-muted" th:text="${'Phòng: ' + showtime.room.name}"></span>
                        </div>
                        <a th:href="@{'/booking/' + ${showtime.id}}" class="btn btn-sm btn-success">Chọn ghế</a>
                    </div>
                    <div th:if="${#lists.isEmpty(showtimes)}" class="alert alert-warning py-2 small">
                        Hiện chưa có suất chiếu cho phim này.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer is now handled by layout.html -->
</body>
</html>
