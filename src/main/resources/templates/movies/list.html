<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-css}">
    <title>Danh sách phim - Smart Cinema</title>
</head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="container mt-4">
        <h2 class="mb-4">Tất cả phim</h2>
        <div class="row">
            <div class="col-md-3 mb-4" th:each="movie : ${movies}">
                <div class="card movie-card h-100 shadow-sm">
                    <img th:src="${movie.posterUrl != null ? movie.posterUrl : 'https://via.placeholder.com/300x450?text=No+Image'}"
                         onerror="this.onerror=null;this.src='https://via.placeholder.com/300x450?text=No+Image';"
                         class="card-img-top" alt="Movie Poster">
                    <div class="card-body">
                        <h5 class="card-title text-truncate" th:text="${movie.title}">Tên phim</h5>
                        <p class="card-text text-muted small">
                            <span th:each="genre, iterStat : ${movie.genres}"
                                  th:text="${genre.name} + ${!iterStat.last ? ', ' : ''}"></span>
                        </p>
                        <a th:href="@{'/movies/' + ${movie.id}}" class="btn btn-primary w-100">Xem chi tiết</a>
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(movies)}" class="col-12 text-center">
                <p class="lead text-muted">Không tìm thấy phim nào.</p>
            </div>
        </div>
    </div>

    <!-- Footer is now handled by layout.html -->
</body>
</html>
