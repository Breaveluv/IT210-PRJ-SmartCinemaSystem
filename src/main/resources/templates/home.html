<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-css}">
    <title>Trang chủ - Smart Cinema</title>
</head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-4">
    <h2 class="mb-4 text-center">Phim Đang Chiếu</h2>
    <div class="row">
        <div class="col-md-3 mb-4" th:each="movie : ${movies}">
            <div class="card movie-card h-100 shadow-sm">
                <img th:src="${movie.posterUrl != null ? movie.posterUrl : 'https://upload.wikimedia.org/wikipedia/vi/4/48/%C4%90%C3%B4r%C3%AAmon-_Cu%E1%BB%99c_x%C3%A2m_l%C4%83ng_m%E1%BB%9Bi.jpg.jpg'}"
                     class="card-img-top" alt="Movie Poster">
                <div class="card-body">
                    <h5 class="card-title text-truncate" th:text="${movie.title}">Tên phim</h5>
                    <p class="card-text text-muted small" th:text="${movie.duration + ' phút'}">Thời lượng</p>
                    <a th:href="@{'/movie/' + ${movie.id}}" class="btn btn-outline-primary w-100">Chi tiết & Đặt vé</a>                </div>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(movies)}" class="col-12 text-center">
            <p class="lead text-muted">Hiện chưa có phim nào đang chiếu.</p>
        </div>
    </div>
</div>

<footer class="text-center bg-dark text-white py-4 mt-5">
    <div class="container">
        <p class="mb-0">&copy; 2023 Smart Cinema Booking System. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
