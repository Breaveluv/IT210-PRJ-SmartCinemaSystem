<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-css}">
    <title>Lịch sử đặt vé - Smart Cinema</title>
</head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="container mt-4">
        <h2 class="mb-4">Lịch sử đặt vé của bạn</h2>
        <div class="table-responsive">
            <table class="table table-hover shadow-sm">
                <thead class="table-dark">
                    <tr>
                        <th>Mã đơn</th>
                        <th>Thời gian đặt</th>
                        <th>Thông tin phim & Suất chiếu</th>
                        <th>Ghế</th>
                        <th>Tổng tiền</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="booking : ${bookings}">
                        <td th:text="${'#' + booking.id}">#1</td>
                        <td th:text="${#temporals.format(booking.bookingTime, 'HH:mm dd/MM/yyyy')}"></td>
                        <td>
                            <div th:each="ticket, iterStat : ${booking.tickets}" th:if="${iterStat.first}">
                                <strong th:text="${ticket.showtime.movie.title}"></strong><br>
                                <span class="small text-muted" th:text="${#temporals.format(ticket.showtime.startTime, 'HH:mm dd/MM/yyyy')}"></span>
                                <span class="small text-muted" th:text="${' - ' + ticket.showtime.room.name}"></span>
                            </div>
                        </td>
                        <td>
                            <span th:each="ticket, iterStat : ${booking.tickets}"
                                  th:text="${ticket.seat.seatName} + ${!iterStat.last ? ', ' : ''}"
                                  class="badge bg-info text-dark"></span>
                        </td>
                        <td th:text="${#numbers.formatDecimal(booking.totalAmount, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}"></td>
                        <td>
                            <span th:classappend="${booking.status.name() == 'CONFIRMED' ? 'bg-success' : (booking.status.name() == 'CANCELLED' ? 'bg-danger' : 'bg-warning')}"
                                  class="badge" th:text="${booking.status}"></span>
                        </td>
                        <td>
                            <a th:href="@{'/booking/cancel/' + ${booking.id}}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Bạn có chắc chắn muốn hủy vé này?')"
                               th:if="${booking.status.name() == 'CONFIRMED'}">Hủy vé</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(bookings)}">
                        <td colspan="7" class="text-center py-4">Bạn chưa có lịch sử đặt vé nào.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer th:replace="~{home :: footer}"></footer>
</body>
</html>
