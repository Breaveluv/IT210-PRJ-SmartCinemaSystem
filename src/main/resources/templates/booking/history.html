<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(pageTitle='Lịch sử đặt vé - CinemaMax')}">
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container mt-5 pt-5"> <!-- Added pt-5 for fixed navbar -->
    <h1 class="my-4 text-center fw-bold text-primary">LỊCH SỬ ĐẶT VÉ CỦA BẠN</h1>

    <div th:if="${errorMessage}" class="alert alert-danger py-2 small bg-dark text-danger border-danger" role="alert">
        <span th:text="${errorMessage}"></span>
    </div>
    <div th:if="${successMessage}" class="alert alert-success py-2 small bg-dark text-success border-success" role="alert">
        <span th:text="${successMessage}"></span>
    </div>

    <div th:if="${bookings.isEmpty()}" class="alert alert-info text-center bg-dark text-info border-info" role="alert">
        Bạn chưa có đơn đặt vé nào.
    </div>

    <div th:each="booking : ${bookings}" class="card shadow-lg bg-dark text-white border-secondary mb-4">
        <div class="card-header d-flex justify-content-between align-items-center bg-dark border-secondary">
            <div>
                Mã đặt vé: <span class="fw-bold text-primary" th:text="${booking.bookingId}"></span>
                <span class="badge rounded-pill ms-2"
                      th:classappend="${booking.bookingStatus == 'CONFIRMED' ? 'bg-success' : (booking.bookingStatus == 'CANCELLED' ? 'bg-danger' : 'bg-warning text-dark')}"
                      th:text="${booking.bookingStatus}"></span>
            </div>
            <div th:if="${booking.bookingStatus == 'CONFIRMED'}">
                <a th:href="@{/booking/cancel/{bookingId}(bookingId=${booking.bookingId})}" class="btn btn-sm btn-warning fw-bold">Hủy vé</a>
            </div>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-3">
                    <img th:src="${booking.moviePosterUrl}" class="img-fluid rounded shadow" alt="Movie Poster">
                </div>
                <div class="col-md-9">
                    <h5 class="card-title fw-bold text-white" th:text="${booking.movieTitle}">Tên Phim</h5>
                    <p class="card-text text-secondary small">
                        <strong>Suất chiếu:</strong> <span th:text="${#temporals.format(booking.showtimeStartTime, 'dd-MM-yyyy HH:mm')}"></span><br>
                        <strong>Phòng:</strong> <span th:text="${booking.roomName}"></span><br>
                        <strong>Ghế đã chọn:</strong>
                    <ul class="seat-list list-unstyled d-inline">
                        <li th:each="seatName : ${booking.seatNames}" th:text="${seatName}" class="d-inline me-1"></li>
                    </ul>
                    <br>
                    <strong>Tổng tiền:</strong> <span class="fw-bold text-danger fs-5" th:text="${#numbers.formatDecimal(booking.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></span><br>
                    <strong>Thời gian đặt:</strong> <span th:text="${#temporals.format(booking.bookingTime, 'dd-MM-yyyy HH:mm')}"></span>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
