<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(pageTitle='Chọn ghế')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container mt-5">
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div th:if="${showtime.soldOut}" class="alert alert-warning">Het ve cho suat chieu nay.</div>

    <form th:action="@{/booking/confirm}" method="post">
        <input type="hidden" name="showtimeId" th:value="${showtime.id}">

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="glass-card p-5 text-center">
                    <div class="screen"></div>

                    <!-- Lưới ghế ngồi -->
                    <div class="mx-auto" style="max-width: 600px;">
                        <div th:if="${#lists.isEmpty(seats)}" class="alert alert-warning">
                            Suất chiếu này chưa có ghế khả dụng. Vui lòng kiểm tra lại cấu hình phòng chiếu.
                        </div>
                        <th:block th:each="seat : ${seats}">
                            <input type="checkbox" name="seatIds"
                                   th:value="${seat.id}"
                                   th:id="'s-' + ${seat.id}"
                                   th:disabled="${#lists.contains(bookedSeatIds, seat.id)}"
                                   class="seat-checkbox">
                            <label th:for="'s-' + ${seat.id}" class="seat-label" th:text="${seat.seatName}"></label>
                        </th:block>
                    </div>

                    <div class="mt-5 d-flex justify-content-center gap-4 small text-secondary">
                        <span><i class="fa-solid fa-square me-1" style="color:#2d3436"></i> Trống</span>
                        <span><i class="fa-solid fa-square me-1 text-primary"></i> Đang chọn</span>
                        <span><i class="fa-solid fa-square me-1 opacity-25"></i> Đã đặt</span>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="glass-card p-4 sticky-top" style="top: 100px;">
                    <h4 class="fw-bold mb-4">THÔNG TIN VÉ</h4>
                    <h5 class="text-primary fw-bold" th:text="${showtime.movie.title}"></h5>
                    <p class="text-secondary small">
                        <span th:text="${showtime.room.name}"></span><br>
                        <span th:text="${#temporals.format(showtime.startTime, 'HH:mm dd/MM/yyyy')}"></span>
                    </p>
                    <div class="bg-dark p-3 rounded-3 mb-4">
                        <span class="text-secondary small">Giá vé niêm yết:</span>
                        <div class="fw-bold fs-5 text-white" th:text="${#numbers.formatDecimal(showtime.price, 0, 'COMMA', 0, 'POINT')} + ' đ/vé'"></div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold" th:disabled="${#lists.isEmpty(seats) or showtime.soldOut}">XÁC NHẬN CHỌN GHẾ</button>
                    <p class="text-center text-secondary small mt-3 italic">* Vui lòng chọn ghế trước khi nhấn xác nhận</p>
                </div>
            </div>
        </div>
    </form>
</div>
</body>
</html>
