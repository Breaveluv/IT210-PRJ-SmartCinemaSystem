<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-css}">
    <title>Chọn ghế - Smart Cinema</title>
</head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Sơ đồ ghế - <span th:text="${showtime.room.name}"></span></h5>
                    </div>
                    <div class="card-body">
                        <div class="screen text-center bg-secondary text-white py-2 mb-5 rounded">MÀN HÌNH</div>

                        <div class="seat-container d-flex flex-wrap justify-content-center">
                            <div th:each="seat : ${seats}" class="m-1 text-center">
                                <button type="button"
                                        th:id="'seat-' + ${seat.id}"
                                        th:classappend="${#lists.contains(bookedSeatIds, seat.id)} ? 'btn-danger disabled' : 'btn-outline-success'"
                                        class="btn btn-sm seat-btn"
                                        th:text="${seat.seatName}"
                                        th:onclick="'toggleSeat(' + ${seat.id} + ')'"
                                        style="width: 45px; height: 45px;">
                                </button>
                            </div>
                        </div>

                        <div class="mt-4 d-flex justify-content-center gap-4">
                            <div><span class="badge bg-outline-success border border-success text-success">&nbsp;&nbsp;</span> Trống</div>
                            <div><span class="badge bg-danger">&nbsp;&nbsp;</span> Đã đặt</div>
                            <div><span class="badge bg-success">&nbsp;&nbsp;</span> Đang chọn</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white text-center">
                        <h5 class="mb-0">Thông tin vé</h5>
                    </div>
                    <div class="card-body">
                        <h6 th:text="${showtime.movie.title}">Tên phim</h6>
                        <p class="small text-muted mb-1">
                            Suất chiếu: <strong th:text="${#temporals.format(showtime.startTime, 'HH:mm dd/MM/yyyy')}"></strong>
                        </p>
                        <p class="small text-muted">Phòng: <span th:text="${showtime.room.name}"></span></p>
                        <hr>
                        <p>Ghế đã chọn: <span id="selected-seats-text" class="fw-bold text-success">Chưa chọn</span></p>
                        <h4 class="text-danger">Tổng: <span id="total-price">0</span> VNĐ</h4>

                        <form th:action="@{/booking/confirm}" method="post" id="booking-form">
                            <input type="hidden" name="showtimeId" th:value="${showtime.id}">
                            <input type="hidden" name="seatIds" id="seatIdsInput">
                            <button type="submit" class="btn btn-success w-100 mt-3" id="confirm-btn" disabled>Xác nhận đặt vé</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        let selectedSeats = [];
        const pricePerSeat = [[${showtime.price}]];

        function toggleSeat(seatId) {
            const btn = document.getElementById('seat-' + seatId);
            if (btn.classList.contains('disabled')) return;

            const index = selectedSeats.indexOf(seatId);
            if (index > -1) {
                selectedSeats.splice(index, 1);
                btn.classList.replace('btn-success', 'btn-outline-success');
            } else {
                selectedSeats.push(seatId);
                btn.classList.replace('btn-outline-success', 'btn-success');
            }
            updateSummary();
        }

        function updateSummary() {
            const text = selectedSeats.length > 0 ? selectedSeats.length + ' ghế' : 'Chưa chọn';
            document.getElementById('selected-seats-text').innerText = text;
            document.getElementById('total-price').innerText = (selectedSeats.length * pricePerSeat).toLocaleString();
            document.getElementById('seatIdsInput').value = selectedSeats.join(',');
            document.getElementById('confirm-btn').disabled = selectedSeats.length === 0;
        }
    </script>

</body>
</html>
