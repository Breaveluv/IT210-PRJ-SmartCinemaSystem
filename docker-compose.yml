version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: smartcinema-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: smartcinema_db
      MYSQL_USER: cinemauser
      MYSQL_PASSWORD: cinema123
      TZ: 'Asia/Ho_Chi_Minh'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
    networks:
      - cinema_network

  # Spring Boot Application
  app:
    build: .
    container_name: smartcinema-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartcinema_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - cinema_network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  cinema_network:
    driver: bridge

